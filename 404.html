<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0A08">
<title>الصفحة مش موجودة | عصام محمد عبدالملك</title>
<link rel="icon" type="image/png" sizes="48x48" href="/EssamMohamed/images/icons/favicon-48.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(60% 50% at 50% 0%,rgba(201,162,75,.22),transparent 70%),#0B0A08;color:#F4EEE1;font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;text-align:center;line-height:1.8}
.n{font-size:clamp(96px,22vw,180px);font-weight:700;line-height:1;margin:0;background:linear-gradient(135deg,#E8C976,#C9A24B);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:Georgia,serif;direction:ltr}
h1{font-size:clamp(24px,5vw,34px);margin:8px 0 10px}
p{margin:0 0 28px;color:#ABA392;font-size:18px}
a{display:inline-block;padding:14px 32px;border-radius:999px;background:linear-gradient(135deg,#E8C976,#C9A24B);color:#14110A;font-weight:700;text-decoration:none;font-size:17px;box-shadow:0 14px 30px -14px rgba(201,162,75,.8)}
a:hover{filter:brightness(1.06)}
a:focus-visible{outline:3px solid #E8C976;outline-offset:3px}
</style>
</head>
<body>
<main>
<div class="n" aria-hidden="true">404</div>
<h1>الصفحة دي مش موجودة</h1>
<p>ممكن الرابط اتغيّر أو اتكتب غلط. ارجع للرئيسية وكمّل من هناك.</p>
<a id="home" href="https://nsessammohamed-spec.github.io/EssamMohamed/">الرئيسية</a>
</main>
<script>
/* بيحسب رابط الرئيسية صح سواء الموقع على github.io (فولدر المشروع) أو على دومين خاص */
(function(){var l=location,b='/';if(/\.github\.io$/.test(l.hostname)){var s=l.pathname.split('/')[1];b=s?'/'+s+'/':'/'}document.getElementById('home').href=b;var i=document.querySelector('link[rel=icon]');if(i)i.href=b+'images/icons/favicon-48.png'})();
</script>
</body>
</html>
