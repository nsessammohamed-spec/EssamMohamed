<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0907" id="tc">
<title>لوحة التحكم</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://*.workers.dev; frame-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="admin.css?v=20261118a">
</head>
<body>

<div id="login" class="login">
  <main class="lmain">
    <form class="lcard" id="loginForm" autocomplete="off">
      <div class="lbrand"><span class="logo">ع</span><span>لوحة التحكم</span></div>
      <h1>أهلاً بيك 👋</h1>
      <p class="lsub">اكتب كلمة السر عشان تدخل لوحة التحكم.</p>
      <label>كلمة السر
        <span class="pw"><input id="pass" type="password" autocomplete="current-password" placeholder="اكتب كلمة السر" required><button type="button" class="ib" id="showTok" aria-label="إظهار كلمة السر"></button></span>
      </label>
      <p class="err" id="loginErr" role="alert" hidden></p>
      <button class="btn primary big" id="loginBtn" type="submit">دخول</button>
      <p class="lfoot">الجلسة بتنتهي لوحدها بعد 4 ساعات.</p>
    </form>
  </main>
</div>

<div id="app" hidden>
  <aside class="side" id="side" aria-label="القائمة الرئيسية">
    <div class="sbrand"><span class="logo">ع</span><div><b>لوحة التحكم</b><small id="repoName"></small></div></div>
    <nav id="nav"></nav>
    <div class="sfoot">
      <button class="btn ghost sm theme-tg" id="themeTg" type="button"></button>
      <a class="btn ghost sm" id="openSite" target="_blank" rel="noopener"></a>
      <div class="kb"><kbd>Ctrl</kbd> + <kbd>S</kbd> للنشر السريع</div>
    </div>
  </aside>
  <div id="scrim"></div>
  <div class="main">
    <header class="bar">
      <button class="ib menu" id="btnMenu" type="button" aria-label="القائمة"></button>
      <div class="ttl"><h1 id="viewTitle"></h1><p id="viewDesc"></p></div>
      <div class="bar-acts">
        <button class="btn ghost sm" id="btnSearch" type="button"></button>
        <span class="status" id="status"></span>
        <button class="btn ghost sm" id="btnPreview" type="button"></button>
        <button class="btn ghost sm" id="btnDiscard" type="button"></button>
        <button class="btn primary" id="btnPublish" type="button"></button>
      </div>
    </header>
    <div class="notice" id="notice" hidden></div>
    <main id="view" class="view"></main>
  </div>
</div>

<dialog id="dlg"></dialog>
<div id="toasts" aria-live="polite"></div>

<div id="preview" class="preview" hidden>
  <div class="pbar">
    <b>معاينة مباشرة</b>
    <span class="seg"><button type="button" data-dev="m" id="devM"></button><button type="button" data-dev="d" id="devD" class="on"></button></span>
    <button class="btn ghost sm" id="pClose" type="button"></button>
  </div>
  <div class="pstage"><iframe id="pframe" title="معاينة الموقع"></iframe></div>
</div>

<script src="../assets/icons.js?v=20261117e"></script>
<script src="config.js"></script>
<script src="admin.js?v=20261117e"></script>
</body>
</html>
