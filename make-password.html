<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تجهيز كلمة السر</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#0B0A08;color:#eee;max-width:640px;margin:0 auto;padding:24px;line-height:1.8}
h1{color:#C9A24B;font-size:22px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #444;background:#1a1814;color:#fff;font-size:16px;margin:6px 0 14px}
textarea{direction:ltr;font-family:monospace;font-size:13px;height:74px}
button{background:#C9A24B;color:#14110A;border:0;border-radius:10px;padding:12px 20px;font-size:16px;cursor:pointer;font-weight:700}
.sm{padding:6px 14px;font-size:14px;margin-bottom:18px}.err{color:#f87171}.note{color:#aaa;font-size:14px}
</style></head><body>
<h1>تجهيز كلمة سر لوحة التحكم</h1>
<p>اكتب كلمة السر اللي عايز تدخل بيها اللوحة (12 حرف أو أكتر — جملة طويلة أحسن). كل ده بيحصل على جهازك ومش بيتبعت لأي مكان.</p>
<label>كلمة السر</label><input id="pw" type="text" autocomplete="off" placeholder="مثال: جملة طويلة بتفتكرها بسهولة">
<button id="go">جهّز الأكواد</button>
<p class="err" id="err"></p>
<div id="out" hidden>
<p>هتنسخ القيمتين دول بعدين. سيب الصفحة مفتوحة.</p>
<label>الكود الأول (ADMIN_HASH)</label><textarea id="h" readonly></textarea><button class="sm" data-c="h">نسخ</button>
<label>الكود التاني (SESSION_SECRET)</label><textarea id="s" readonly></textarea><button class="sm" data-c="s">نسخ</button>
<p class="note">متبعتش الأكواد دي لحد. ومتنساش كلمة السر — مش هتتعرض تاني.</p>
</div>
<script>
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
document.getElementById('go').onclick=async()=>{
  const pw=document.getElementById('pw').value,er=document.getElementById('err');er.textContent='';
  if(pw.length<12){er.textContent='كلمة السر قصيرة. اكتب 12 حرف على الأقل.';return}
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:100000},k,256);
  document.getElementById('h').value=hex(salt)+':'+hex(bits);
  document.getElementById('s').value=hex(crypto.getRandomValues(new Uint8Array(32)));
  document.getElementById('out').hidden=false;
};
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const t=document.getElementById(b.dataset.c);t.select();navigator.clipboard.writeText(t.value);b.textContent='اتنسخ ✓'});
</script></body></html>
